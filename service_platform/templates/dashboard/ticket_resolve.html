{% extends 'base.html' %}
{% block content %}
<h1>Resolve Support Ticket #{{ ticket.id }}</h1>
<div class="form-card">
    <p><strong>Customer:</strong> {{ ticket.customer.username }}</p>
    <p><strong>Subject:</strong> {{ ticket.subject }}</p>
    <p>{{ ticket.description }}</p>
    <form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-service">Save Response</button> <a class="btn btn-service-outline" href="{% url 'admin_ticket_list' %}">Cancel</a></form>
</div>
{% endblock %}
